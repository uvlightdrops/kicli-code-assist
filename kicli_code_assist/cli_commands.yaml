version: 1
name: kicli-assist
help: KI Code Assistant - interactive code generation and review
commands:
  - name: tui
    help: Launch the terminal UI
    callback: kicli_code_assist.cli:run_tui
    options:
      - names: ["-c", "--config"]
        param: config
        type: str
        default: null
        help: Optional config file path
      - names: ["--provider"]
        param: provider
        type: str
        default: null
        help: LLM provider override
  - name: tmux
    help: Launch the tmux-based layout
    callback: kicli_code_assist.cli:run_tmux
    options:
      - names: ["--simple"]
        param: simple
        type: bool
        default: false
        help: Use the simple 2-pane layout
      - names: ["-s", "--session"]
        param: session
        type: str
        default: ki-assist
        help: Session name
  - name: chat
    help: Run the simple chat flow
    callback: kicli_code_assist.cli:run_chat
    options:
      - names: ["--model"]
        param: model
        type: str
        default: null
        help: Override the model name
      - names: ["--provider"]
        param: provider
        type: str
        default: null
        help: LLM provider override
  - name: openinterpreter
    help: Launch OpenInterpreter mode
    callback: kicli_code_assist.cli:run_openinterpreter
    options:
      - names: ["-y", "--auto-run"]
        param: auto_run
        type: bool
        default: false
        help: Auto-run code if allowed
      - names: ["--model"]
        param: model
        type: str
        default: null
        help: Override the model name
  - name: doctor
    help: Show CLI and environment diagnostics
    callback: kicli_code_assist.cli:run_doctor
  - name: config
    help: Config management (from ki-core)
    commands:
      - name: resolve
        help: Resolve and display full config
        callback: kicli_code_assist.cli:run_config
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "resolve"
            help: Subcommand
      - name: verify
        help: Verify config against schema
        callback: kicli_code_assist.cli:run_config
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "verify"
            help: Subcommand
      - name: skeleton
        help: Generate config skeleton
        callback: kicli_code_assist.cli:run_config
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "skeleton"
            help: Subcommand
          - names: ["-o", "--output"]
            param: output
            type: str
            default: "ki.yaml"
            help: Output file
      - name: show
        help: Show config or specific key
        callback: kicli_code_assist.cli:run_config
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "show"
            help: Subcommand
          - names: ["--key"]
            param: key
            type: str
            default: null
            help: Specific key to show
  - name: profile
    help: Profile management (from ki-core)
    commands:
      - name: list
        help: List available profiles
        callback: kicli_code_assist.cli:run_profile
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "list"
            help: Subcommand
      - name: set
        help: Set active profile
        callback: kicli_code_assist.cli:run_profile
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "set"
            help: Subcommand
          - names: ["--name"]
            param: name
            type: str
            default: null
            help: Profile name
      - name: active
        help: Show active profile
        callback: kicli_code_assist.cli:run_profile
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "active"
            help: Subcommand
  - name: stage
    help: Stage management (from ki-core)
    commands:
      - name: list
        help: List available stages
        callback: kicli_code_assist.cli:run_stage
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "list"
            help: Subcommand
      - name: set
        help: Set active stage
        callback: kicli_code_assist.cli:run_stage
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "set"
            help: Subcommand
          - names: ["--name"]
            param: name
            type: str
            default: null
            help: Stage name
      - name: active
        help: Show active stage
        callback: kicli_code_assist.cli:run_stage
        options:
          - names: ["--subcommand"]
            param: subcommand
            type: str
            default: "active"
            help: Subcommand
  - name: server
    help: Manage services (backend, frontend, etc.)
    callback: kicli_code_assist.cli:run_server
    options:
      - names: ["--subcommand"]
        param: subcommand
        type: str
        default: "status"
        help: "Subcommand: status, register, unregister, detect-orphans, cleanup, sync"
      - names: ["--name"]
        param: name
        type: str
        default: null
        help: Service name (for register/unregister)
      - names: ["--pid"]
        param: pid
        type: int
        default: null
        help: Process ID (for register)
      - names: ["--port"]
        param: port
        type: int
        default: null
        help: Port number (for register)
      - names: ["-v", "--verbose"]
        param: verbose
        type: bool
        default: false
        help: Show detailed information

