# Apache2 VHost Configuration - OPTION 2 (Dual-Port, Flexible)
#
# Frontend (Vite dev server) on :3000
# Backend (Flask API + WebSocket) on :8000
# Firewall-risky if port 3000 blocked, but better for dev workflow
#
# Install:
#   sudo cp kicli-web-option2.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http rewrite proxy_wstunnel
#   sudo a2ensite kicli-web-option2.conf
#   sudo systemctl reload apache2
#
# Test:
#   curl -H "Host: kicli.example.com" http://localhost/api/health
#   curl -H "Host: kicli.example.com" http://localhost/

<VirtualHost *:80>
    ServerName kicli.example.com
    ServerAlias kicli
    ServerAdmin admin@example.com

    # ========================================================================
    # Proxy Configuration: API & WebSocket → Flask (:8000)
    # ========================================================================
    
    ProxyPreserveHost On
    ProxyRequests Off
    
    # API routes to Flask backend
    <Location /api/>
        ProxyPass http://localhost:8000/api/
        ProxyPassReverse http://localhost:8000/api/
    </Location>
    
    # WebSocket for chat
    <Location /socket.io/>
        ProxyPass ws://localhost:8000/socket.io/
        ProxyPassReverse http://localhost:8000/socket.io/
        ProxyPassReverseCookiePath / /
    </Location>
    
    # ========================================================================
    # Proxy Configuration: Frontend → Vite (:3000)
    # ========================================================================
    
    # All other traffic (HTML, JS, CSS, etc.) to Vite dev server
    <Location />
        ProxyPass http://localhost:3000/
        ProxyPassReverse http://localhost:3000/
    </Location>
    
    # WebSocket for Vite HMR (Hot Module Replacement)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteCond %{REQUEST_URI} !^/api/ [NC]
    RewriteCond %{REQUEST_URI} !^/socket.io/ [NC]
    RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]
    
    # ========================================================================
    # Logging & Performance
    # ========================================================================
    
    ErrorLog ${APACHE_LOG_DIR}/kicli-option2-error.log
    CustomLog ${APACHE_LOG_DIR}/kicli-option2-access.log combined
    
    # Timeouts
    TimeOut 300
    ProxyTimeout 300
    
    # Buffer settings
    ProxyBufferSize 8192
    ProxyBuffers 8 8192
    ProxyBuffering Off
    
    # ========================================================================
    # Security Headers (optional)
    # ========================================================================
    
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-Content-Type-Options "nosniff"
    Header set X-XSS-Protection "1; mode=block"

</VirtualHost>
