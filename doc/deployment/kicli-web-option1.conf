# Apache2 VHost Configuration - OPTION 1 (Single-Port, Recommended)
#
# Deploy built frontend via Flask static files
# Requires: npm run build && ./scripts/collect_static.sh
#
# Install:
#   sudo cp kicli-web-option1.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite kicli-web-option1.conf
#   sudo systemctl reload apache2
#
# Test:
#   curl -H "Host: kicli.example.com" http://localhost/api/health

<VirtualHost *:80>
    ServerName kicli.example.com
    ServerAlias kicli
    ServerAdmin admin@example.com

    # ========================================================================
    # Proxy Configuration
    # ========================================================================
    
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Route ALL traffic (API + static + WebSocket) to Flask backend on :8000
    # Flask serves:
    #   - /api/* routes
    #   - /socket.io/* WebSocket
    #   - /* static files from kicli_code_assist/web/static/
    
    <Location />
        ProxyPass http://localhost:8000/
        ProxyPassReverse http://localhost:8000/
    </Location>
    
    # WebSocket upgrade support
    <Location /socket.io/>
        ProxyPass http://localhost:8000/socket.io/
        ProxyPassReverse http://localhost:8000/socket.io/
        ProxyPassReverseCookiePath / /
        
        # Required for WebSocket tunneling
        RewriteEngine On
        RewriteCond %{HTTP:Upgrade} websocket [NC]
        RewriteCond %{HTTP:Connection} upgrade [NC]
        RewriteRule ^/?(.*) "ws://localhost:8000/$1" [P,L]
    </Location>
    
    # ========================================================================
    # Logging & Performance
    # ========================================================================
    
    ErrorLog ${APACHE_LOG_DIR}/kicli-option1-error.log
    CustomLog ${APACHE_LOG_DIR}/kicli-option1-access.log combined
    
    # Timeouts (increased for long-polling if needed)
    TimeOut 300
    ProxyTimeout 300
    
    # Buffer settings for streaming responses
    ProxyBufferSize 8192
    ProxyBuffers 8 8192
    ProxyBuffering Off
    
    # ========================================================================
    # Security Headers (optional)
    # ========================================================================
    
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-Content-Type-Options "nosniff"
    Header set X-XSS-Protection "1; mode=block"

</VirtualHost>
