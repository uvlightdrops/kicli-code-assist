# Logging configuration for kicli-code-assist
# Maps module names to log levels (DEBUG, INFO, WARNING, ERROR)
#
# Hybrid logfile strategy:
#   kicli.log              - Main log (all events for general debugging)
#   kicli-llm.log          - LLM queries, responses, provider, URL, payload
#   kicli-context.log      - File loading, cache hits, deduplication events
#   kicli-workflow.log     - Approval workflow, user actions
#   kicli-errors.log       - Errors only (easy filtering)
#

[debug]
# Uncomment modules here to enable DEBUG level logging for development
# kicli.llm_integration
# kicli.ai_workflow
# kicli.approval_workflow
# kicli.llm.query

[info]
# Modules at INFO level (default for most)
kicli.llm_integration
kicli.ai_workflow
kicli.approval_workflow
kicli.tui
kicli.context_manager

[warning]
# Modules at WARNING level (less verbose)
# kicli.legacy_module

[error]
# Modules logged only for errors
kicli.llm_integration
kicli.ai_workflow
