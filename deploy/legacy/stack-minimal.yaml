# Minimal Stack Configuration (Variante #1: TUI-Only)
# Location: kicli-code-assist/deploy/stack-minimal.yaml
#
# Runs Flask API only, no WebUI (suitable for terminal-based workflows)
# This is the leanest deployment option
#
# USAGE:
#   ln -sf stack-minimal.yaml stack.yaml
#   stackctl -t local start
#
# ENDPOINTS:
#   - API only: http://127.0.0.1:8000/api/...
#   - No frontend served
#
# NOTES:
#   - Use this for server-only or TUI-only deployments
#   - Lowest resource usage, no JavaScript/npm dependencies needed at runtime

stack:
  name: kicli-assist-minimal
  target: local
  
  services:
    web:
      kind: process
      command: ["{python}", "-m", "kicli_code_assist.web.server"]
      cwd: "{root}"
      host: 127.0.0.1
      port: 8000
      env:
        PYTHONUNBUFFERED: "1"
        KI_STAGE: "production"
      health_path: /api/health
      health_timeout: 10
      health_retries: 5
      health_interval: 2
      stdout_log: "log/web.log"
      stderr_log: "log/web.err.log"
