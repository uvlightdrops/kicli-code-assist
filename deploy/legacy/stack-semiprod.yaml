# Semi-Prod Stack Configuration (Variante #3: Production-Ready)
# Location: kicli-code-assist/deploy/stack-semiprod.yaml
#
# Runs Flask API serving both API endpoints and pre-built frontend static files
# This is the default for production deployments (symlinked as stack.yaml)
#
# USAGE:
#   # Pre-build frontend once:
#   cd web/frontend && npm run build  # outputs to ../kicli_code_assist/web/static/
#   
#   # Then run:
#   cd /path/to/kicli-code-assist
#   ln -sf stack-semiprod.yaml stack.yaml
#   stackctl -t local start
#
# ENDPOINTS:
#   - API: http://127.0.0.1:8000/api/...
#   - Frontend static: http://127.0.0.1:8000/
#
# NOTES:
#   - Flask auto-serves static files from kicli_code_assist/web/static/
#   - No separate frontend server required
#   - Apache reverse proxy listens on :80/:443 and forwards to Flask :8000

stack:
  name: kicli-assist-semiprod
  target: local
  
  services:
    # Main Web Application (Flask)
    # Serves both API + Static Frontend Files
    web:
      kind: process
      command: ["{python}", "-m", "kicli_code_assist.web.server"]
      cwd: "{root}"
      host: 127.0.0.1           # Localhost (Apache reverse proxy handles external)
      port: 8000
      pidfile: ".kicli.pid"     # Store PID for monitoring
      env:
        PYTHONUNBUFFERED: "1"
        KI_STAGE: "production"
      
      # Health check before marking ready
      health_path: /api/health
      health_timeout: 10        # Startup can be slow
      health_retries: 5
      health_interval: 2
      
      # Logging
      stdout_log: "log/web.log"
      stderr_log: "log/web.err.log"

