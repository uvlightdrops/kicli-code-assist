# Semi-Prod Stack Configuration (Variante #3: Production)
# Used by: systemd service + stackctl for orchestration
# Location: kicli-code-assist/deploy/stack.yaml
#
# PRE-BUILD: npm run build (frontend static files to kicli_code_assist/web/static/)
# THEN: stackctl local start --project .
#
# Flask serves both:
# - /api/* routes (backend)
# - /* static files (frontend built output)

stack:
  name: kicli-assist-semiprod
  target: local
  
  services:
    # Main Web Application (Flask)
    # Serves both API + Static Frontend Files
    web:
      kind: process
      command: ["{python}", "-m", "kicli_code_assist.web.server"]
      cwd: "{root}"
      host: 127.0.0.1           # Localhost (Apache reverse proxy handles external)
      port: 8000
      pidfile: ".kicli.pid"     # Store PID for monitoring
      env:
        PYTHONUNBUFFERED: "1"
        KI_STAGE: "production"
      
      # Health check before marking ready
      health_path: /api/health
      health_timeout: 10        # Startup can be slow
      health_retries: 5
      health_interval: 2
      
      # Logging
      stdout_log: "log/web.log"
      stderr_log: "log/web.err.log"

