[build-system]
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kicli-code-assist"
version = "0.1.0"
description = "Headless Code Assistant with TUI and Diff Preview"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KI Team"}]

dependencies = [
    "textual>=0.20.0",
    "textual-vim-textarea>=0.1.0",
    "rich>=13.0.0",
    "pygments>=2.14.0",
    "pyyaml>=6.0",
    "click>=8.1.7",
    "ki-core @ file:///home/flow/dev_flow/ki-core",
    "yaml-cfg-wizard @ file:///home/flow/dev_flow/yaml_cfg_wizard",
    "flowpy @ file:///home/flow/dev_flow/flowpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pip-audit>=2.7.0",
]
audit = ["pip-audit>=2.7.0"]

[project.scripts]
kicli-assist = "kicli_code_assist.cli:cli"
kicli-assist-tmux = "kicli_code_assist.tmux_launcher:main"

[tool.stackctl]
config_loader = "ki_core:load_config"
config_key = "stack"

[[tool.stackctl.siblings]]
name = "yaml-cfg-wizard"
path = "yaml_cfg_wizard"
url = "https://github.com/uvlightdrops/yaml-cfg-wizard.git"

[[tool.stackctl.siblings]]
name = "ki-core"
url = "https://github.com/uvlightdrops/ki-core.git"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["kicli_code_assist*"]

[tool.setuptools.package-data]
kicli_code_assist = ["cli_commands.yaml"]
