# Default stack configuration (Development with HMR)
# This is the base configuration; override via stages for other scenarios

stack:
  name: kicli-assist
  target: local
  services:
    api:
      kind: process
      command: ["{python}", "-m", "kicli_code_assist.web.server"]
      cwd: "{root}"
      host: 127.0.0.1
      port: 8000
      env:
        PYTHONUNBUFFERED: "1"
      health_path: /api/health
      health_timeout: 10
      health_retries: 5
      health_interval: 2
      stdout_log: "log/api.log"
      stderr_log: "log/api.err.log"
    
    frontend:
      kind: process
      command: ["{root}/web/frontend/node_modules/.bin/vite"]
      cwd: "{root}/web/frontend"
      host: 127.0.0.1
      port: 5173
      depends_on: [api]
      env:
        VITE_API_URL: "http://127.0.0.1:8000"
      health_path: /
      health_timeout: 15
      health_retries: 3
      stdout_log: "log/frontend.log"
      stderr_log: "log/frontend.err.log"
