# TUI Configuration
# Compatible with yaml-cfg-wizard and ki.yaml merge system

# File tree panel
file_tree:
  enabled: true
  project_root: "."
  ignore_patterns:
    - .git
    - __pycache__
    - .venv
    - node_modules
    - .pytest_cache

# Agent tabs panel
agent_tabs:
  enabled: true
  enabled_tabs:
    - Explain
    - Suggest
    - Reason
    - Metrics
    - Refactor
    - Dependencies
  default_tab: Explain

# Backend API
backend:
  url: "http://localhost:8000"
  timeout: 30
  retry_count: 3

# Editor modes
editor:
  vi_mode: true
  preview_enabled: true

# UI styling
ui:
  theme: dark
  layout: split  # split | focused
  debug: false

# Logging
logs:
  enabled: true
  max_lines: 100
  level: INFO

