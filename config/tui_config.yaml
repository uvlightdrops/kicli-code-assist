# TUI Configuration
# Compatible with yaml-cfg-wizard and ki.yaml merge system

# File tree panel
file_tree:
  enabled: true
  project_root: "."
  ignore_patterns:
    - .git
    - __pycache__
    - .venv
    - node_modules
    - .pytest_cache

# Agent tabs panel
agent_tabs:
  enabled: true
  enabled_tabs:
    - Explain
    - Suggest
    - Reason
    - Metrics
    - Refactor
    - Dependencies
  default_tab: Explain

# Backend API
backend:
  url: "http://localhost:8000"
  timeout: 30
  retry_count: 3

# Streaming configuration (Phase 1.2)
streaming:
  enabled: true
  protocol: websocket  # websocket | http
  fallback_to_http: true
  min_token_delay_ms: 20  # Minimum milliseconds between token renders
  max_buffer_size: 100    # Maximum buffered tokens before backpressure
  auto_reconnect: true
  reconnect_delay_ms: 1000
  max_reconnect_attempts: 5

# Editor modes
editor:
  vi_mode: true
  preview_enabled: true

# UI styling
ui:
  theme: dark
  layout: split  # split | focused
  debug: false
  show_progress: true  # Show progress bar during streaming
  show_metrics: true   # Show token count and timing in status bar

# Logging
logs:
  enabled: true
  max_lines: 100
  level: INFO
