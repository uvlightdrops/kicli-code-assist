$schema: "http://json-schema.org/draft-07/schema#"
title: "KiCLI Code Assist Configuration"
description: "Application-specific schema for kicli-code-assist"
type: object
properties:
  storage:
    type: object
    title: "Storage Locations"
    properties:
      cache_dir:
        type: string
        default: ""
        description: "Cache directory (defaults to ~/dev_data/kicli-code-assist)"
      session_dir:
        type: string
        default: ""
        description: "Directory for task/session tracking state"
      history_dir:
        type: string
        default: ""
        description: "Directory for chat history persistence"
      log_dir:
        type: string
        default: ""
        description: "Directory for application logs (defaults to ~/dev_data/kicli-code-assist/log)"
    additionalProperties: true
  security:
    type: object
    title: "Path Security Settings"
    properties:
      allowed_base_path:
        type: string
        default: ""
        description: "Absolute path that must not be left (e.g. /home/user/project). Empty string = no restriction"
      enforce_path_restriction:
        type: boolean
        default: false
        description: "Enable path restriction enforcement"
    additionalProperties: true
  web:
    type: object
    title: "Web Server"
    description: "Flask/Socket.IO backend of the web IDE (read at process start)"
    properties:
      host:
        type: string
        title: "Bind host"
        default: "127.0.0.1"
        description: "Interface the web backend binds to; keep loopback unless protected by a proxy"
      port:
        type: integer
        title: "Port"
        default: 8000
        minimum: 1
        maximum: 65535
        description: "TCP port of the web backend"
      cors_origins:
        type: array
        title: "Allowed origins"
        default: ["http://localhost:3000"]
        items:
          type: string
          pattern: "^https?://[A-Za-z0-9.\\[\\]:-]+$"
        description: "Browser origins allowed to call the API (scheme://host[:port], no path)"
    additionalProperties: true
  agent:
    type: object
    title: "Agent Streaming"
    description: "Agent intervention/streaming/rollback behaviour (read per request)"
    properties:
      intervention:
        type: object
        title: "Intervention"
        properties:
          mode:
            type: string
            title: "Intervention mode"
            enum: ["queue", "supervisor", "user_prompt"]
            default: "user_prompt"
            description: "How conflicting user/supervisor commands are handled"
        additionalProperties: false
      streaming:
        type: object
        title: "Streaming"
        properties:
          thinking_detail:
            type: string
            title: "Thinking detail"
            enum: ["minimal", "balanced", "verbose"]
            default: "balanced"
            description: "Amount of agent reasoning streamed to the UI"
          state_broadcast_rate:
            type: integer
            title: "State broadcast rate"
            minimum: 1
            maximum: 100
            default: 10
            description: "State updates per second sent over WebSocket"
          websocket_timeout:
            type: integer
            title: "WebSocket timeout (s)"
            minimum: 10
            maximum: 300
            default: 30
            description: "Seconds without client activity before a stream is dropped"
        additionalProperties: false
      rollback:
        type: object
        title: "Rollback"
        properties:
          auto_on_error:
            type: boolean
            default: true
            description: "Roll back agent changes automatically on errors"
          log_error_artifacts:
            type: boolean
            default: true
            description: "Keep error artifacts for inspection"
          preserve_branch:
            type: boolean
            default: false
            description: "Keep the work branch after a rollback"
        additionalProperties: false
      state:
        type: object
        title: "State"
        properties:
          persistence:
            type: string
            enum: ["json", "sqlite"]
            default: "json"
            description: "Agent state storage format"
          retention:
            type: string
            enum: ["session", "7days", "permanent"]
            default: "session"
            description: "How long agent state is kept"
          export_on_completion:
            type: boolean
            default: true
            description: "Export the agent state when a run completes"
        additionalProperties: false
    additionalProperties: true
  prompts:
    type: object
    title: "Prompt Management Settings"
    properties:
      active_role:
        type: string
        default: "developer"
        description: "Currently active prompt role"
      roles:
        type: object
        additionalProperties:
          type: object
          properties:
            name:
              type: string
              description: "Display name of the role"
            description:
              type: string
              description: "Role description"
            system_prompt:
              type: string
              description: "System prompt for this role"
            enabled:
              type: boolean
              default: true
            version:
              type: string
              default: "1.0"
          required: ["name", "system_prompt"]
          additionalProperties: true
      custom_templates:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: "Unique identifier"
            name:
              type: string
              description: "Template name"
            description:
              type: string
              description: "Template description"
            system_prompt:
              type: string
              description: "System prompt text"
            tags:
              type: array
              items:
                type: string
            created_at:
              type: string
              format: "date-time"
            modified_at:
              type: string
              format: "date-time"
          required: ["id", "name", "system_prompt"]
          additionalProperties: true
      language_learning:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
          target_language:
            type: string
            description: "Language to learn"
          native_language:
            type: string
            default: "English"
            description: "Native language"
          level:
            type: string
            enum: ["beginner", "intermediate", "advanced"]
            default: "beginner"
        additionalProperties: true
      favorites:
        type: array
        items:
          type: string
        description: "Favorite roles/templates"
      auto_save_custom:
        type: boolean
        default: true
        description: "Auto-save custom templates to config"
    additionalProperties: true
  apps:
    type: object
    properties:
      kicli:
        type: object
        title: "KiCLI Settings"
        properties:
          workspace_root:
            type: string
            description: "Root directory for workspace analysis"
            default: ""
          prompt_history_dir:
            type: string
            description: "Directory to store prompt history"
            default: ""
          context:
            type: object
            title: "Context Configuration"
            properties:
              max_files:
                type: integer
                description: "Maximum number of files to include in context"
                default: 10
                minimum: 1
                maximum: 1000
              max_size_mb:
                type: number
                description: "Maximum total size of context files in MB"
                default: 5
                minimum: 0.1
                maximum: 1000
              relevance_threshold:
                type: number
                description: "Minimum relevance score for file inclusion (0-1)"
                default: 0.15
                minimum: 0
                maximum: 1
              cache_enabled:
                type: boolean
                description: "Enable context caching"
                default: true
              cache_ttl_hours:
                type: integer
                description: "Cache time-to-live in hours"
                default: 24
                minimum: 1
              cache_max_size_mb:
                type: number
                description: "Maximum cache size in MB"
                default: 50
                minimum: 1
              ignore_patterns:
                type: string
                description: "Comma-separated glob patterns to ignore"
                default: "__pycache__,*.pyc,node_modules,.git,.env"
            additionalProperties: false
            required: []
          diff:
            type: object
            title: "Diff Configuration"
            properties:
              context_lines:
                type: integer
                description: "Number of context lines around changes"
                default: 3
                minimum: 0
                maximum: 50
              format:
                type: string
                description: "Diff format (unified, context, or side-by-side)"
                enum: ["unified", "context", "side-by-side"]
                default: "unified"
              highlight_syntax:
                type: boolean
                description: "Enable syntax highlighting in diffs"
                default: true
              auto_apply_threshold:
                type: number
                description: "Confidence threshold for auto-applying changes (0-1)"
                default: 0.8
                minimum: 0
                maximum: 1
              max_file_size_kb:
                type: integer
                description: "Maximum file size for diff display in KB"
                default: 100
                minimum: 1
            additionalProperties: false
            required: []
        additionalProperties: false
        required: []
    additionalProperties: true
additionalProperties: true
