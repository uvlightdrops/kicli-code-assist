$schema: "http://json-schema.org/draft-07/schema#"
title: "KiCLI Code Assist Configuration"
description: "Application-specific schema for kicli-code-assist"
type: object
properties:
  storage:
    type: object
    title: "Storage Locations"
    properties:
      cache_dir:
        type: string
        default: ""
        description: "Cache directory (defaults to ~/dev_data/kicli-code-assist)"
      session_dir:
        type: string
        default: ""
        description: "Directory for task/session tracking state"
      history_dir:
        type: string
        default: ""
        description: "Directory for chat history persistence"
    additionalProperties: true
  security:
    type: object
    title: "Path Security Settings"
    properties:
      allowed_base_path:
        type: string
        default: ""
        description: "Absolute path that must not be left (e.g. /home/user/project). Empty string = no restriction"
      enforce_path_restriction:
        type: boolean
        default: false
        description: "Enable path restriction enforcement"
    additionalProperties: true
  prompts:
    type: object
    title: "Prompt Management Settings"
    properties:
      active_role:
        type: string
        default: "developer"
        description: "Currently active prompt role"
      roles:
        type: object
        additionalProperties:
          type: object
          properties:
            name:
              type: string
              description: "Display name of the role"
            description:
              type: string
              description: "Role description"
            system_prompt:
              type: string
              description: "System prompt for this role"
            enabled:
              type: boolean
              default: true
            version:
              type: string
              default: "1.0"
          required: ["name", "system_prompt"]
          additionalProperties: true
      custom_templates:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: "Unique identifier"
            name:
              type: string
              description: "Template name"
            description:
              type: string
              description: "Template description"
            system_prompt:
              type: string
              description: "System prompt text"
            tags:
              type: array
              items:
                type: string
            created_at:
              type: string
              format: "date-time"
            modified_at:
              type: string
              format: "date-time"
          required: ["id", "name", "system_prompt"]
          additionalProperties: true
      language_learning:
        type: object
        properties:
          enabled:
            type: boolean
            default: false
          target_language:
            type: string
            description: "Language to learn"
          native_language:
            type: string
            default: "English"
            description: "Native language"
          level:
            type: string
            enum: ["beginner", "intermediate", "advanced"]
            default: "beginner"
        additionalProperties: true
      favorites:
        type: array
        items:
          type: string
        description: "Favorite roles/templates"
      auto_save_custom:
        type: boolean
        default: true
        description: "Auto-save custom templates to config"
    additionalProperties: true
  apps:
    type: object
    properties:
      kicli:
        type: object
        title: "KiCLI Settings"
        properties:
          workspace_root:
            type: string
            description: "Root directory for workspace analysis"
            default: ""
          prompt_history_dir:
            type: string
            description: "Directory to store prompt history"
            default: ""
          context:
            type: object
            title: "Context Configuration"
            properties:
              max_files:
                type: integer
                description: "Maximum number of files to include in context"
                default: 10
                minimum: 1
                maximum: 1000
              max_size_mb:
                type: number
                description: "Maximum total size of context files in MB"
                default: 5
                minimum: 0.1
                maximum: 1000
              relevance_threshold:
                type: number
                description: "Minimum relevance score for file inclusion (0-1)"
                default: 0.15
                minimum: 0
                maximum: 1
              cache_enabled:
                type: boolean
                description: "Enable context caching"
                default: true
              cache_ttl_hours:
                type: integer
                description: "Cache time-to-live in hours"
                default: 24
                minimum: 1
              cache_max_size_mb:
                type: number
                description: "Maximum cache size in MB"
                default: 50
                minimum: 1
              ignore_patterns:
                type: string
                description: "Comma-separated glob patterns to ignore"
                default: "__pycache__,*.pyc,node_modules,.git,.env"
            additionalProperties: false
            required: []
          diff:
            type: object
            title: "Diff Configuration"
            properties:
              context_lines:
                type: integer
                description: "Number of context lines around changes"
                default: 3
                minimum: 0
                maximum: 50
              format:
                type: string
                description: "Diff format (unified, context, or side-by-side)"
                enum: ["unified", "context", "side-by-side"]
                default: "unified"
              highlight_syntax:
                type: boolean
                description: "Enable syntax highlighting in diffs"
                default: true
              auto_apply_threshold:
                type: number
                description: "Confidence threshold for auto-applying changes (0-1)"
                default: 0.8
                minimum: 0
                maximum: 1
              max_file_size_kb:
                type: integer
                description: "Maximum file size for diff display in KB"
                default: 100
                minimum: 1
            additionalProperties: false
            required: []
        additionalProperties: false
        required: []
    additionalProperties: true
additionalProperties: true
